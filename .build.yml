image: debian/stable
packages:
  - build-essential
  - cmake
  - ninja-build
  - git
  - python3
  - python3-pip
  - python3-venv
  - gcc-arm-none-eabi
  - gcc-13-aarch64-linux-gnu
  - g++-13-aarch64-linux-gnu
  - libnewlib-arm-none-eabi
  - libstdc++-arm-none-eabi-newlib
  - pkg-config
  - wget
  - ca-certificates
  - tar
sources:
  - https://git.sr.ht/~itsams_wav/DigiSynth
tasks:
  - build-central-unit: |
      cd DigiSynth/central_unit
      python3 -m pip install --break-system-packages --no-cache-dir conan
      export PATH="$HOME/.local/bin:$PATH"
      sed -i 's#CXX=/usr/bin/aarch64-linux-gnu-g++#CXX=/usr/bin/aarch64-linux-gnu-g++-13#; s#CC=/usr/bin/aarch64-linux-gnu-gcc#CC=/usr/bin/aarch64-linux-gnu-gcc-13#' conan/rpi.ci.profile
      conan profile detect --force
      conan export conan/pigpio --name=pigpio --version=79
      conan install . --profile:host=conan/rpi.ci.profile --profile:build=default --build=missing
      cmake --preset conan-release
      cmake --build --preset conan-release --parallel
  - build-audio-unit: |
      cd DigiSynth/audio_unit
      cmake -S . -B build --preset Debug
      cmake --build build --parallel
  - build-keyboard-unit: |
      cd "$HOME"
      mkdir -p "$HOME/cmsis-toolbox"
      wget -qO- "https://github.com/Open-CMSIS-Pack/cmsis-toolbox/releases/download/2.13.0/cmsis-toolbox-linux-amd64.tar.gz" | tar -xz -C "$HOME/cmsis-toolbox" --strip-components=1
      export PATH="$HOME/cmsis-toolbox/bin:$PATH"
      export CMSIS_PACK_ROOT="$PWD/.cmsis-packs"
      mkdir -p "$CMSIS_PACK_ROOT"
      cpackget init https://www.keil.com/pack/index.pidx
      GCC_VERSION="$(arm-none-eabi-gcc --version | grep -oP '\d+\.\d+\.\d+' | head -1)"
      GCC_BIN="$(dirname "$(which arm-none-eabi-gcc)")"
      eval "export GCC_TOOLCHAIN_$(echo "$GCC_VERSION" | tr '.' '_')="$GCC_BIN""
      cd DigiSynth/keyboard_unit/new
      cbuild "Keyboard Unit.csolution.yml" --packs --toolchain GCC --context ".Debug+STM32F103C8"
      tar -czf out-artifacts.tar.gz out
artifacts:
  - DigiSynth/keyboard_unit/new/out-artifacts.tar.gz
