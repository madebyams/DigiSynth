audio_unit:build:
  image: git.anothersimplecoder.de:5050/anothersimplecoder/dev-containers/arm-none-eabi:latest
  stage:  build
  tags:
    - amd64
  cache:
    key: audio_unit-fetchcontent
    paths:
      - audio_unit/build/_deps
  script:
    - |
      cd audio_unit
      cmake -S . -B build --preset Debug
      cmake --build build